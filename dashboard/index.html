<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coastal Dashboard</title>
<meta name="theme-color" content="#0EA5E9">
<link rel="manifest" href="data:application/json,%7B%22name%22%3A%22Coastal%22%2C%22short_name%22%3A%22Coastal%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23F8FAFC%22%2C%22theme_color%22%3A%22%230EA5E9%22%2C%22icons%22%3A%5B%5D%7D">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{brand:'#0EA5E9',accent:'#F59E0B'}}}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',system-ui,sans-serif;background:#F8FAFC;color:#0F172A;margin:0}
.card{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(15,23,42,0.06),0 1px 2px rgba(15,23,42,0.04)}
.btn-p{background:#F59E0B;color:#fff;font-weight:700;padding:10px 18px;border-radius:10px;transition:.15s;border:0;cursor:pointer;display:inline-block;text-decoration:none;text-align:center}
.btn-p:hover{background:#D97706}
.btn-s{background:#0EA5E9;color:#fff;font-weight:600;padding:8px 14px;border-radius:8px;border:0;cursor:pointer;text-decoration:none;display:inline-block}
.btn-s:hover{background:#0284C7}
.btn-o{border:1px solid #CBD5E1;background:#fff;color:#0F172A;font-weight:600;padding:8px 14px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-block}
.btn-o:hover{border-color:#0EA5E9;color:#0EA5E9}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700}
.s-NUEVO{background:#E0F2FE;color:#075985}
.s-CONTACTADO{background:#DBEAFE;color:#1E40AF}
.s-RESPONDIO_FRIO{background:#E0E7FF;color:#4338CA}
.s-RESPONDIO_CALIENTE{background:#FEF3C7;color:#92400E}
.s-DEMO_ENVIADA{background:#FED7AA;color:#9A3412}
.s-NEGOCIANDO{background:#FECACA;color:#991B1B}
.s-OBJECION{background:#FBCFE8;color:#9F1239}
.s-CERRADO_GANADO{background:#BBF7D0;color:#166534}
.s-CERRADO_PERDIDO{background:#E5E7EB;color:#374151}
.s-GHOSTED{background:#F3F4F6;color:#6B7280}
.backdrop{background:rgba(15,23,42,.55);backdrop-filter:blur(4px);position:fixed;inset:0;z-index:50}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0F172A;color:#fff;padding:12px 20px;border-radius:10px;z-index:1000;box-shadow:0 10px 25px rgba(0,0,0,.2)}
#loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#F8FAFC;z-index:9999;flex-direction:column;gap:12px;transition:opacity .3s}
.spinner{width:40px;height:40px;border:4px solid #E0F2FE;border-top-color:#0EA5E9;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.fade-out{opacity:0;pointer-events:none}
@media(max-width:768px){.sidebar{display:none}.bottom-nav{display:flex!important}}
@media(min-width:769px){.bottom-nav{display:none}}
.scroll-hide::-webkit-scrollbar{display:none}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #F1F5F9;font-size:13px}
th{background:#F8FAFC;font-size:11px;color:#64748B;text-transform:uppercase;letter-spacing:.5px}
tr:hover{background:#F0F9FF;cursor:pointer}
.flag{font-size:1.3em}
select,input,textarea{font-family:inherit}
</style>
</head>
<body>
<div id="loader"><div class="spinner"></div><div id="loader-msg" style="color:#64748B;font-size:14px">🌊 Cargando dashboard...</div></div>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="./app.js?v=1776461902353"></script>
</body>
</html>
